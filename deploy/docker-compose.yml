services:
  xf-backend:
    image: xf-backend:latest
    container_name: xf-backend
    restart: unless-stopped
    environment:
      VLLM_API_BASE: "${VLLM_API_BASE}"
      VLLM_API_KEY: "${VLLM_API_KEY:-EMPTY}"
      MODEL_NAME: "${MODEL_NAME:-/data/xyc/fire_hydrant/output_model}"
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  xf-frontend:
    image: xf-frontend:latest
    container_name: xf-frontend
    restart: unless-stopped
    depends_on:
      - xf-backend
    environment:
      BACKEND_ORIGIN: "${BACKEND_ORIGIN:-http://xf-backend:5000}"
    ports:
      - "${HOST_PORT:-80}:80"
